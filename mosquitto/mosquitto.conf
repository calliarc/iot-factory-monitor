# Eclipse Mosquitto 2.x configuration for IoT Factory Monitor.
# Authentication is REQUIRED (no anonymous clients). The password file is
# generated at container start by docker-entrypoint.sh from the
# MQTT_*_PASSWORD variables in .env. See README "Security notes" for TLS.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

listener 1883
protocol mqtt

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Queued QoS 1 messages kept per offline persistent client (the ingestor uses a
# persistent session, so short ingestor restarts do not lose data).
max_queued_messages 100000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
