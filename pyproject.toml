[project]
name = "iot-factory-monitor"
version = "0.1.0"
description = "Manufacturing IoT pipeline: MQTT to TimescaleDB to Grafana."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ingestor", "simulator"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
